<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=IBM+Plex+Mono:wght@400;700&display=swap">
<style>
/* 링크 미리보기 카드 1200×630 */
*{box-sizing:border-box}
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:#FAFAF7;color:#191C20;font-family:"IBM Plex Sans KR","Malgun Gothic",sans-serif;
     display:grid;grid-template-columns:1fr 470px;gap:56px;padding:70px 72px}
.l{display:flex;flex-direction:column;justify-content:center}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:20px;letter-spacing:2px;color:#9C5B2F;
         text-transform:uppercase;margin-bottom:22px}
h1{font-size:76px;line-height:1.12;margin:0 0 24px;letter-spacing:-2px;font-weight:700}
.sub{font-size:27px;color:#4C525A;line-height:1.5;margin:0 0 34px}
.stats{display:flex;gap:14px;flex-wrap:wrap}
.stats span{font-size:21px;border:2px solid #E4E3DC;border-radius:999px;padding:8px 20px;background:#fff}
.stats b{color:#9C5B2F}
.card{align-self:center;background:#fff;border:2px solid #E4E3DC;border-radius:22px;padding:30px 30px 26px;
      box-shadow:0 18px 50px rgba(60,40,20,.08)}
.tag{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:14px;color:#9C5B2F;
     background:#F3E7DD;border-radius:7px;padding:5px 12px;margin-bottom:16px;letter-spacing:.5px}
.q{font-size:23px;font-weight:600;line-height:1.5;margin:0 0 18px;word-break:keep-all}
.o{display:flex;gap:12px;align-items:flex-start;border:2px solid #E4E3DC;border-radius:12px;
   padding:11px 14px;margin-bottom:9px;font-size:19px;line-height:1.45}
.o .k{color:#6A7079;font-size:20px}
.o.ok{border-color:#15692F;background:#E3F0E5}
.o.ok .k{color:#15692F;font-weight:700}
</style></head><body>
<div class="l">
  <div class="eyebrow">AI Literacy Drill</div>
  <h1>AI 리터러시<br>드릴</h1>
  <p class="sub">생성형 AI·ML 개념부터<br>AI 결과를 검증하는 판단력까지</p>
  <div class="stats">
    <span><b>155</b>문항</span><span>긴 지문 세트 <b>8</b>개</span><span>실전 모드 · 해설</span>
  </div>
</div>
<div class="card">
  <div class="tag">AI 출력 검증</div>
  <p class="q">불량률 1% 데이터에서 정확도 99%가 나왔다. 올바른 해석은?</p>
  <div class="o"><span class="k">①</span><span>아주 우수한 모델이다</span></div>
  <div class="o ok"><span class="k">②</span><span>전부 ‘정상’으로 찍어도 나오는 수치다</span></div>
  <div class="o"><span class="k">③</span><span>재현율도 99%일 것이다</span></div>
</div>
</body></html>
