<p>A 반도체 팹의 설비 엔지니어 팀은 하루 평균 <b>1,800건</b>의 설비 알림을 받는다. 대부분은 일시적인 센서 튐이고, 실제 조치가 필요한 알림은 하루 <b>30건</b> 안팎이다. 엔지니어들은 알림을 하나씩 열어 로그를 읽느라 하루 2시간 넘게 쓴다고 말한다.</p>
<p>팀장은 LLM이 알림 로그를 요약하고 <b>조치 필요 / 관찰 / 무시</b> 세 등급으로 분류하는 도구를 2주간 시범 운영했다.</p>

c3: { title: "고객 의견 분류 프롬프트 개선", body: `
<p>고객경험팀은 고객 의견(VOC)을 <b>불량·배송·가격·응대·기타</b> 5개 유형으로 분류하는 데 LLM을 쓴다. 담당자가 프롬프트를 고친 뒤 성능을 비교했다.</p>
<pre>[프롬프트 v1]
다음 고객 의견을 분류해줘.

[프롬프트 v2]
다음 고객 의견을 불량·배송·가격·응대·기타 중 하나로만 분류해.
여러 유형에 걸치면 고객이 가장 불만인 것 하나를 고르고,
어디에도 맞지 않으면 기타. 답은 유형 이름만 써.
예시) "포장은 멀쩡한데 화면이 안 켜져요" → 불량</pre>
<table>
<tr><th></th><th>평가에 쓴 데이터</th><th>정답과 일치</th></tr>
<tr><td>v1</td><td>3월 VOC 100건</td><td>64건</td></tr>
<tr><td>v2</td><td>4월 VOC 100건</td><td>83건</td></tr>
</table>
<p>담당자는 "프롬프트를 고쳐 정확도가 19%p 올랐다"고 보고하려 한다. 참고로 3월에는 배송 지연 이슈가 많았고, 4월에는 거의 없었다.</p>` },

c4: { title: "AI가 작성한 기능 효과 분석", body: `
<p>앱 서비스팀이 신규 기능 '스마트 알림'의 효과를 알고 싶어 AI에게 분석을 맡겼다. 테이블은 세 개다.</p>
<table>
<tr><th>테이블</th><th>컬럼</th></tr>
<tr><td>users</td><td>user_id, signup_date</td></tr>
<tr><td>feature_usage</td><td>user_id, used_date — 스마트 알림을 켠 사람만 행이 있다</td></tr>
<tr><td>visits</td><td>user_id, visit_date</td></tr>
</table>
<p>AI가 처음 작성한 쿼리:</p>
<pre>SELECT COUNT(DISTINCT v.user_id) * 1.0 / COUNT(DISTINCT f.user_id) AS retention
FROM feature_usage f
JOIN visits v ON v.user_id = f.user_id
WHERE v.visit_date >= f.used_date + INTERVAL 30 DAY</pre>
<p>AI는 쿼리를 한 번 고쳐 다시 돌린 뒤 이렇게 결론냈다.</p>
<pre>스마트 알림을 켠 사용자의 30일 후 재방문율은 78%로,
전체 사용자 평균(39%)의 2배입니다.
스마트 알림이 재방문을 2배로 늘렸습니다.</pre>
<p>스마트 알림은 설정 메뉴 깊숙한 곳에 있어 사용자가 직접 찾아서 켜야 한다.</p>` },

c5: { title: "수율 예측 모델 검토", body: `
<p>데이터 분석가가 웨이퍼 로트(lot)의 최종 수율이 기준에 못 미칠지를 예측하는 모델을 만들어 보고했다. 목적은 <b>공정 중간 단계에서 위험 로트를 미리 골라 추가 검사</b>를 하는 것이다.</p>
<table>

</table>
<p>특성 중요도 상위 3개</p>

<p>데이터는 2025년 1월~2026년 6월 로트이며, 2026년 2월에 주요 장비 교체가 있었다.</p>` },

c6: { title: "협력사 회의록 요약과 사내 지침", body: `

 ① 영업비밀, 미공개 사업 계획, 거래 조건은 외부 생성형 AI 서비스에 입력할 수 없다.

<p>직원은 "개인 계정으로 쓰는 외부 AI 챗봇이 요약을 더 잘한다"며 그쪽을 쓰고 싶어 한다.</p>` },

c7: { title: "구매 승인 에이전트 사고", body: `

c8: { title: "AI가 쓴 월간 품질 리포트", body: `
<p>품질팀이 AI에게 3개 생산 라인의 월간 리포트 초안을 맡겼다. 원자료는 다음과 같다.</p>

 c:["비용·지연·온프레미스 운영에 유리해서","항상 정확도가 더 높아서","환각이 없어서","컨텍스트가 무한해서"],a:0,
 e:"작은 모델은 싸고 빠르고, <b>사내망 안에서 돌릴 수 있다</b>. 보안이 중요한 제조·금융에서 특히 중요하다. 대신 복잡한 추론은 약하므로 작업 난이도에 맞춰 고른다."},
{t:"gen",q:"시스템 프롬프트의 역할은?",
 c:["대화 전체에 적용되는 역할·규칙·톤을 정한다","모델을 재학습시킨다","출력 토큰을 늘린다","응답을 캐싱한다"],a:0,
 e:"매 턴 반복해 말하지 않아도 되도록 <b>전역 규칙</b>을 올려 두는 자리다. 다만 사용자 입력이 이를 흔들 수 있으므로(프롬프트 인젝션) 보안 경계로 믿어서는 안 된다."},
{t:"gen",q:"멀티모달 모델이란?",
 c:["텍스트 외에 이미지·음성 등 여러 형태의 입력을 함께 다루는 모델","여러 회사의 모델을 묶은 것","여러 언어를 지원하는 모델","여러 GPU에서 돌아가는 모델"],a:0,
 e:"제조 현장에서는 <b>불량 사진 + 검사 로그</b>를 함께 넣고 판정 근거를 설명하게 하는 식으로 쓴다. 여러 언어를 지원하는 건 멀티링구얼(multilingual)로 다른 개념이다."},

/* ── RAG·파인튜닝 ────────────────────────────────────────── */
{t:"rag",q:"사내 규정 문서가 매달 바뀐다. 챗봇이 항상 최신 규정으로 답하게 하려면?",
 c:["RAG로 문서를 검색해 컨텍스트에 넣는다","매달 파인튜닝을 다시 한다","temperature를 0으로 둔다","모델을 더 큰 것으로 바꾼다"],a:0,
 e:"<b>지식이 자주 바뀌면 RAG</b>다. 문서만 갈아 끼우면 끝이고 출처도 보여줄 수 있다. 파인튜닝은 학습을 다시 돌려야 해서 비용·시간이 크고, 어느 문장이 근거였는지 추적도 안 된다."},
{t:"rag",q:"파인튜닝이 RAG보다 적합한 경우는?",
 c:["출력 형식이나 말투를 일관되게 고정하고 싶을 때","최신 뉴스를 반영하고 싶을 때","근거 문서를 출처로 제시해야 할 때","문서가 매일 바뀔 때"],a:0,
 e:"파인튜닝은 <b>행동 방식(형식·톤·태스크 수행 패턴)</b>을 몸에 익히게 하는 쪽에 강하다. 반대로 '사실 지식을 주입'하는 용도로는 비효율적이고, 틀린 지식을 고치기도 어렵다."},
{t:"rag",q:"새 기능을 만들 때 보통 가장 먼저 시도해야 할 순서는?",
 c:["프롬프팅 → RAG → 파인튜닝","파인튜닝 → RAG → 프롬프팅","RAG → 파인튜닝 → 프롬프팅","셋을 동시에"],a:0,
 e:"<b>싸고 빠른 것부터</b>가 원칙이다. 프롬프트로 해결되면 거기서 끝내고, 지식이 부족하면 RAG를 붙이고, 그래도 안 되면 파인튜닝을 검토한다. 거꾸로 가면 돈과 시간이 샌다."},
{t:"rag",q:"RAG 파이프라인의 일반적인 순서는?",
 c:["문서 분할 → 임베딩 → 색인 → 검색 → 생성","검색 → 학습 → 배포 → 생성","임베딩 → 파인튜닝 → 추론","수집 → 라벨링 → 학습 → 평가"],a:0,
 e:"문서를 적당한 크기로 자르고(chunking), 벡터로 바꾸고, 검색 가능하게 쌓아 두었다가, 질문이 오면 관련 조각을 꺼내 <b>프롬프트에 끼워 넣고</b> 답을 만들게 한다."},
{t:"rag",q:"RAG에서 청크(chunk)를 너무 크게 자르면 생기는 문제는?",
 c:["관련 없는 내용이 섞여 검색 정확도와 답변 품질이 떨어진다","임베딩을 만들 수 없다","검색 속도가 0이 된다","모델이 오류를 낸다"],a:0,
 e:"너무 크면 잡음이 섞이고 토큰도 낭비된다. 너무 작으면 <b>맥락이 끊겨</b> 조각만 봐서는 뜻이 안 통한다. 보통 문단 단위로 자르고 앞뒤를 조금 겹치게(overlap) 둔다."},
{t:"rag",q:"RAG를 붙였는데도 환각이 남는다. 가장 흔한 원인은?",
 c:["검색이 엉뚱한 문서를 가져왔거나 근거가 없는데도 답하게 둬서","모델이 작아서","temperature가 0이라서","임베딩 차원이 낮아서"],a:0,
 e:"RAG의 품질은 <b>검색 품질에 달려 있다</b>. 쓰레기를 넣으면 쓰레기가 나온다. 그리고 '근거에 없으면 모른다고 답하라'를 지시하지 않으면 모델은 빈칸을 상상으로 메운다."},
{t:"rag",q:"벡터 검색에 키워드 검색(BM25 등)을 함께 쓰는 '하이브리드 검색'의 장점은?",
 c:["제품 코드·고유명사 같은 정확한 일치에 강해진다","임베딩이 필요 없어진다","비용이 0이 된다","환각이 사라진다"],a:0,
 e:"벡터 검색은 의미는 잘 잡지만 <code>H5-2024A</code> 같은 <b>정확한 문자열에는 약하다</b>. 제조·금융처럼 코드와 규격이 많은 도메인에서 하이브리드가 특히 효과적이다."},
{t:"rag",q:"RAG가 파인튜닝 대비 갖는 운영상 장점으로 가장 중요한 것은?",
 c:["답변의 근거 문서를 제시할 수 있어 검증이 가능하다","계산이 빨라진다","모델 크기가 작아진다","프롬프트가 짧아진다"],a:0,
 e:"현업에서 AI 답을 신뢰하려면 <b>\"이거 어디서 나온 말이냐\"에 답할 수 있어야 한다</b>. RAG는 출처를 달 수 있고 파인튜닝은 못 한다. 규제 산업에서 결정적인 차이다."},

/* ── 프롬프트 ────────────────────────────────────────────── */
{t:"prm",q:"few-shot 프롬프팅이란?",
 c:["프롬프트 안에 입력·출력 예시를 몇 개 보여주는 것","모델을 몇 번만 학습시키는 것","짧은 프롬프트를 쓰는 것","토큰을 적게 쓰는 것"],a:0,
 e:"원하는 <b>형식과 판단 기준을 예시로 보여주는</b> 방법이다. 말로 설명하기 어려운 톤·형식을 맞출 때 효과가 크다. 학습이 아니라 그 요청 안에서만 적용된다."},
{t:"prm",q:"Chain-of-Thought(생각의 사슬) 기법의 핵심은?",
 c:["단계별로 추론 과정을 거쳐 답하게 시키는 것","답을 여러 번 물어보는 것","프롬프트를 사슬처럼 연결하는 것","모델 여러 개를 연결하는 것"],a:0,
 e:"\"단계별로 생각해 보라\"처럼 중간 과정을 쓰게 하면 <b>다단계 추론 문제의 정확도가 올라간다</b>. 대신 토큰과 시간이 늘고, 단순 분류 같은 작업에는 효과가 거의 없다."},
{t:"prm",q:"출력을 프로그램이 바로 받아 쓰려 한다. 가장 적절한 지시는?",
 c:["JSON 등 정해진 스키마로만 출력하게 하고 설명은 금지한다","되도록 자세히 설명하게 한다","표로 예쁘게 그리게 한다","temperature를 높인다"],a:0,
 e:"파싱할 거라면 <b>형식을 못 박고 군더더기를 금지</b>해야 한다. \"설명 없이 JSON만\"처럼. 많은 API가 구조화 출력(structured output) 옵션을 제공하니 그걸 쓰는 게 더 확실하다."},
{t:"prm",q:"프롬프트에 역할(role)을 부여하는 이유는?",
 c:["답변의 관점·용어·깊이를 그 역할에 맞춰 좁히기 위해","모델 성능을 영구히 올리기 위해","토큰을 아끼기 위해","학습 데이터를 바꾸기 위해"],a:0,
 e:"\"반도체 공정 엔지니어로서\"를 붙이면 용어와 관점이 달라진다. 다만 <b>없던 지식이 생기지는 않는다</b>. 역할 부여는 출력을 조준하는 장치지 성능 향상 마법이 아니다."},
{t:"prm",q:"프롬프트를 개선했는지 판단하는 올바른 방법은?",
 c:["고정된 평가셋에 여러 번 돌려 지표로 비교한다","한 번 돌려보고 좋아 보이면 채택한다","길이가 짧아졌으면 개선된 것","모델 제공사의 추천을 따른다"],a:0,
 e:"출력이 매번 달라지므로 <b>한 번 돌려본 인상으로는 판단할 수 없다</b>. 테스트 케이스를 모아 두고 같은 조건에서 반복 측정해 비교해야 한다. 이게 '결과 검증' 역량의 핵심이다."},

/* ── ML 기초·지표 ────────────────────────────────────────── */
{t:"ml",q:"지도학습(supervised learning)의 정의는?",
 c:["정답 레이블이 있는 데이터로 입력→출력 관계를 학습","레이블 없이 군집을 찾는 학습","보상을 통해 행동을 학습","사람이 규칙을 직접 코딩"],a:0,
 e:"정답이 붙은 데이터가 핵심이다. 분류(불량/정상)와 회귀(수율 예측)가 여기 속한다. 레이블이 없으면 비지도, 보상으로 배우면 강화학습이다."},
{t:"ml",q:"불량률이 1%인 데이터에서 모델이 정확도(accuracy) 99%를 기록했다. 올바른 해석은?",
 c:["전부 '정상'이라고만 찍어도 나오는 수치라 의미가 없을 수 있다","아주 우수한 모델이다","재현율도 99%일 것이다","데이터가 잘못됐다"],a:0,
 e:"<b>불균형 데이터에서 정확도는 거짓말을 한다.</b> 이게 시험 단골이다. 전부 다수 클래스로 찍어도 99%가 나온다. 정밀도·재현율·F1·PR-AUC를 봐야 하고, 불량을 놓치면 안 되는 상황이라면 <b>재현율</b>이 최우선이다."},
{t:"ml",q:"정밀도(precision)의 정의는?",
 c:["모델이 양성이라 한 것 중 실제 양성의 비율","실제 양성 중 모델이 찾아낸 비율","전체 중 맞힌 비율","오답의 비율"],a:0,
 e:"<code>TP / (TP + FP)</code>. <b>\"경보가 울렸을 때 그게 진짜일 확률\"</b>이다. 정밀도가 낮으면 헛경보가 많아 현장이 알림을 무시하게 된다."},
{t:"ml",q:"재현율(recall)의 정의는?",
 c:["실제 양성 중 모델이 찾아낸 비율","양성이라 한 것 중 맞은 비율","전체 정확도","거짓 양성 비율"],a:0,
 e:"<code>TP / (TP + FN)</code>. <b>\"진짜 불량 중 몇 개나 잡았나\"</b>다. 불량을 놓치면 치명적인 공정 검사, 질병 진단에서는 정밀도를 희생하더라도 재현율을 올린다."},
{t:"ml",q:"정밀도와 재현율의 관계로 옳은 것은?",
 c:["판정 임계값을 조절하면 보통 한쪽이 오르고 다른 쪽이 내린다","둘은 항상 같이 움직인다","둘은 무관하다","둘을 동시에 100%로 만들 수 있다"],a:0,
 e:"임계값을 낮추면 더 많이 '양성'이라 하므로 <b>재현율↑ 정밀도↓</b>, 올리면 반대다. 그래서 \"어느 쪽 실수가 더 비싼가\"를 정한 뒤 임계값을 고른다. 이건 기술 문제가 아니라 <b>비즈니스 판단</b>이다."},
{t:"ml",q:"F1 점수란?",
 c:["정밀도와 재현율의 조화평균","정밀도와 재현율의 산술평균","정확도의 제곱","오차의 합"],a:0,
 e:"조화평균이라 <b>한쪽이 많이 낮으면 점수도 확 떨어진다</b>. 둘의 균형을 하나로 보고 싶을 때 쓴다. 단순 평균이 아니라는 점이 자주 틀리는 부분이다."},
{t:"ml",q:"클래스 불균형이 심할 때 ROC-AUC보다 더 적절한 지표는?",
 c:["PR-AUC (정밀도-재현율 곡선 아래 면적)","정확도","MSE","R²"],a:0,
 e:"ROC는 음성이 압도적으로 많으면 <b>실제보다 좋아 보이게</b> 나온다. 소수 클래스를 찾는 게 목적이면 PR 곡선이 성능 차이를 더 정직하게 보여준다."},
{t:"ml",q:"과적합(overfitting)이란?",
 c:["학습 데이터에만 잘 맞고 새 데이터에서는 성능이 떨어지는 상태","학습이 덜 된 상태","데이터가 너무 많은 상태","모델이 너무 작은 상태"],a:0,
 e:"잡음까지 외워버린 상태다. 신호는 <b>학습 성능은 높은데 검증 성능이 낮은 것</b>. 대응은 데이터 늘리기, 정규화, 드롭아웃, 조기 종료, 모델 단순화."},
{t:"ml",q:"편향-분산 트레이드오프에서 '분산이 높다'는 것은?",
 c:["데이터가 조금만 바뀌어도 모델이 크게 달라진다(과적합 경향)","모델이 너무 단순하다","학습이 안 된다","데이터가 치우쳐 있다"],a:0,
 e:"분산↑ = 과적합, 편향↑ = 과소적합이다. 모델을 복잡하게 하면 편향은 줄고 분산은 는다. 둘의 합이 최소가 되는 지점을 찾는 게 모델 선택이다."},
{t:"ml",q:"L1 정규화(Lasso)의 특징으로 옳은 것은?",
 c:["일부 계수를 정확히 0으로 만들어 특성 선택 효과가 있다","모든 계수를 똑같이 줄인다","계수를 키운다","분류에만 쓸 수 있다"],a:0,
 e:"L1은 <b>불필요한 특성을 0으로 꺼버려</b> 자동 특성 선택이 된다. L2(Ridge)는 0으로 만들지는 않고 전체적으로 작게 눌러 준다."},
{t:"ml",q:"K-fold 교차검증을 쓰는 이유는?",

{t:"ml",q:"표준화(z-score 정규화)를 하면 각 특성은 어떻게 되나?",

{t:"ml",q:"k-means에서 군집 수 k를 정할 때 흔히 쓰는 방법은?",

{t:"ml",q:"MAPE(평균 절대 백분율 오차)를 쓸 때 주의할 점은?",

 e:"실제값으로 나누기 때문에 <b>실제값이 0이거나 매우 작으면 오차가 무한히 커진다.</b> 판매량이 0인 날이 많은 데이터에는 MAE 같은 다른 지표를 쓴다."},
{t:"ml",q:"학습률·트리 깊이처럼 사람이 학습 전에 정하는 값을 뭐라고 하나?",

{t:"dl",q:"분류 신경망 학습에 주로 쓰는 손실 함수는?",

{t:"mfg",q:"오토인코더로 이상을 탐지하는 원리는?",

 e:"정상만 보고 '압축했다 다시 펼치는 법'을 배운다. <b>처음 보는 이상 패턴은 잘 복원하지 못해 오차가 커진다.</b> 불량 샘플이 거의 없을 때 쓰는 대표 방법이다."},

/* ── AI 반도체·하드웨어 (1교시) ─────────────────────────────── */
{t:"hw",q:"HBM(고대역폭 메모리)이 AI 연산에 특히 중요한 이유는?",
 c:["GPU에 데이터를 아주 빠르게 공급해 메모리 병목을 줄여서","전력을 전혀 쓰지 않아서","CPU를 대신해 연산을 직접 해서","저장 용량이 SSD보다 커서"],a:0,
 e:"AI 연산은 계산 자체보다 <b>데이터를 메모리에서 꺼내 오는 속도</b>에 막히는 경우가 많다. HBM은 통로가 넓어 한 번에 많은 데이터를 GPU로 보낸다. 그래서 AI 가속기 옆에 붙는다."},
{t:"hw",q:"HBM의 구조적 특징으로 옳은 것은?",
 c:["D램을 수직으로 쌓고 관통 전극(TSV)으로 연결해 GPU 가까이 붙인다","하드디스크처럼 회전하는 원판을 쓴다","CPU 내부에 들어 있다","전원이 꺼져도 데이터가 유지되는 낸드다"],a:0,
 e:"여러 층의 D램을 아파트처럼 쌓고 층 사이를 구멍(TSV)으로 잇는다. <b>GPU 바로 옆에 두어 데이터가 오가는 거리를 줄이고 통로를 넓힌다.</b> 꺼지면 지워지는 D램이고, 낸드(저장용)와는 다르다."},
{t:"hw",q:"딥러닝 연산에 CPU보다 GPU가 유리한 핵심 이유는?",
 c:["수천 개의 코어로 행렬 연산을 대량 병렬 처리해서","클럭 속도가 CPU보다 훨씬 높아서","운영체제를 실행할 수 있어서","메모리가 필요 없어서"],a:0,
 e:"딥러닝은 같은 곱셈·덧셈을 엄청나게 많이 반복하는 일이다. CPU는 복잡한 일을 몇 개씩 빠르게, <b>GPU는 단순한 일을 수천 개 동시에</b> 처리한다. 클럭은 오히려 CPU가 높다."},
{t:"hw",q:"LLM이 답을 한 글자씩 생성할 때 성능을 가장 크게 제한하는 것은 흔히 무엇인가?",
 c:["모델 가중치를 메모리에서 읽어 오는 속도(메모리 대역폭)","키보드 입력 속도","디스크 저장 공간","화면 해상도"],a:0,
 e:"토큰 하나를 만들 때마다 거대한 가중치를 메모리에서 다시 읽어야 한다. 계산은 금방 끝나는데 <b>읽어 오는 게 느려서 기다리는</b> 상황 — 이걸 메모리 병목(memory wall)이라 한다. HBM이 중요한 이유가 이것이다."},
{t:"hw",q:"파라미터 70억 개(7B) 모델을 16비트(2바이트)로 메모리에 올리면 가중치만 대략 얼마가 필요한가?",
 c:["약 14GB","약 1.4GB","약 140GB","약 7MB"],a:0,
 e:"<code>70억 × 2바이트 = 140억 바이트 ≈ 14GB</code>. 8비트로 양자화하면 절반인 7GB, 4비트면 3.5GB다. <b>파라미터 수 × 바이트 수</b>로 바로 계산할 수 있다. 실제로는 KV 캐시 등이 더 든다."},
{t:"hw",q:"학습(training)과 추론(inference)의 차이로 옳은 것은?",
 c:["학습은 가중치를 갱신하고, 추론은 학습된 가중치로 결과를 낸다","학습은 빠르고 추론은 항상 더 느리다","추론에서도 가중치를 매번 갱신한다","둘은 같은 말이다"],a:0,
 e:"학습은 대량의 데이터로 가중치를 고치는 <b>한 번의 큰 작업</b>, 추론은 그 모델로 <b>매 요청마다 답을 내는 반복 작업</b>이다. 서비스에서는 추론 비용과 지연이 계속 쌓이므로 추론 효율이 중요하다."},
{t:"hw",q:"LLM의 KV 캐시(KV cache)가 하는 일은?",
 c:["앞서 처리한 토큰의 중간 계산값을 저장해 다음 토큰 생성 때 다시 계산하지 않게 한다","대화 내용을 디스크에 영구 저장한다","모델 가중치를 압축한다","사용자 비밀번호를 암호화한다"],a:0,
 e:"이미 계산한 걸 저장해 두는 메모장이다. 속도는 빨라지지만 <b>대화가 길어질수록 차지하는 메모리가 커진다.</b> 긴 컨텍스트가 메모리를 많이 먹는 이유다."},
{t:"hw",q:"온디바이스 AI(기기 안에서 모델을 돌리는 방식)의 장점이 <u>아닌</u> 것은?",
 c:["아주 큰 모델도 제약 없이 돌릴 수 있다","네트워크 없이도 동작한다","개인정보가 기기 밖으로 나가지 않는다","서버 왕복이 없어 응답이 빠를 수 있다"],a:0,
 e:"기기의 메모리와 전력은 서버보다 훨씬 작다. 그래서 <b>모델 크기에 제약이 있고</b>, 양자화나 소형 모델이 필요하다. 나머지 셋은 실제 장점이다."},
{t:"hw",q:"PIM(Processing-In-Memory)의 핵심 아이디어는?",
 c:["메모리 안에서 연산 일부를 처리해 데이터 이동을 줄인다","메모리를 CPU 밖으로 완전히 없앤다","데이터를 클라우드로만 보낸다","GPU 대신 하드디스크로 연산한다"],a:0,
 e:"데이터를 연산 장치까지 옮기는 데 드는 시간과 전력이 크다. 그렇다면 <b>데이터가 있는 메모리 쪽에서 간단한 연산을 해버리자</b>는 발상이다. 메모리 병목을 다른 방향으로 푸는 방법이다."},
{t:"hw",q:"추론 서버에서 배치 크기(한 번에 묶어 처리하는 요청 수)를 키우면 일반적으로?",
 c:["전체 처리량은 늘지만 개별 요청의 응답은 늦어질 수 있다","모든 요청이 더 빨라진다","정확도가 크게 오른다","메모리 사용량이 줄어든다"],a:0,
 e:"여러 요청을 묶으면 GPU를 꽉 채워 <b>시간당 처리량(throughput)</b>은 오른다. 대신 묶음이 찰 때까지 기다리거나 한 번에 오래 걸려 <b>지연(latency)</b>은 늘 수 있다. 실시간 서비스냐 대량 처리냐에 따라 고른다."},

/* ── AI 출력 검증 (2교시) ──────────────────────────────────── */
{t:"chk",q:"AI가 이렇게 답했다. “(가상) 2025년 국내 반도체 수출은 전년 대비 32% 증가한 1,420억 달러다. 출처: 산업통상자원부 보도자료” — 보고서에 쓰기 전 가장 먼저 할 일은?",
 c:["출처 원문을 직접 찾아 수치를 대조한다","출처가 적혀 있으니 그대로 쓴다","다른 AI에게 물어 같은 답이면 쓴다","숫자가 구체적이니 믿는다"],a:0,

{t:"chk",q:"“유저당 평균 결제액”을 구해 달랬더니 AI가 <code>SELECT AVG(amount) FROM payments</code> 를 줬다. 문제점은?",
 c:["결제 건당 평균이라, 여러 번 결제한 유저가 여러 번 반영된다","문법 오류가 있다","결과가 항상 0이 나온다","문제없다"],a:0,
 e:"한 유저가 10번 결제하면 10번 들어간다. 유저당이면 <b>유저별 합계를 먼저 구한 뒤 유저 수로 나눠야</b> 한다. 쿼리가 '돌아간다'와 '맞다'는 다른 문제다 — AI 코드 검증의 핵심."},
{t:"chk",q:"원문: “3분기 매출은 전년보다 8% 줄었지만 영업이익은 12% 늘었다.” AI 요약: “3분기 실적이 개선됐다.” 이 요약의 문제는?",
 c:["매출 감소를 빠뜨려 한쪽만 전달했다","길이가 너무 짧다","숫자를 반올림했다","문제없다"],a:0,

{t:"chk",q:"AI가 “이 모델은 정확도 95%이므로 불량 탐지에 적합하다”고 결론냈다. 빠진 검증은?",
 c:["불량 비율과 재현율 — 불량을 실제로 몇 개 잡는지","학습에 걸린 시간","모델 파일 크기","사용한 프로그래밍 언어"],a:0,
 e:"불량이 5%면 전부 '정상'이라 찍어도 95%다. <b>불균형 데이터에서 정확도만 보고 내린 결론은 검증이 안 된 결론</b>이다."},
{t:"chk",q:"AI가 짠 데이터 처리 코드가 예시 데이터 3건에서는 잘 돌았다. 실제로 쓰기 전에 더 할 일은?",
 c:["빈 데이터·경계값·NULL·중복 같은 예외 상황으로 테스트한다","예시가 맞았으니 바로 쓴다","코드를 더 길게 만든다","주석만 추가한다"],a:0,
 e:"예시에서 맞는 건 시작일 뿐이다. <b>값이 없을 때, 0일 때, 같은 값이 겹칠 때</b> 무너지는 코드가 많다. 실제 쿼리 테스트가 데이터셋을 여러 개 쓰는 이유도 이것이다."},
{t:"chk",q:"AI가 “캠페인 시작 후 매출이 20% 늘었으므로 캠페인이 효과적이었다”고 분석했다. 가장 큰 문제는?",
 c:["계절성 등 다른 요인을 통제하지 않은 전후 비교다","20%가 너무 작다","그래프가 없다","캠페인 이름이 빠졌다"],a:0,
 e:"같은 시기에 명절이 있었다면? 경쟁사가 품절이었다면? <b>전후 비교는 그 사이 일어난 모든 일이 섞인다.</b> 대조군(캠페인을 안 본 집단)이 있어야 효과를 말할 수 있다."},
{t:"chk",q:"같은 사실 질문을 AI에게 세 번 했더니 답이 2:1로 갈렸다. 올바른 해석은?",

 e:"답이 흔들린다는 건 <b>모델이 모른다는 신호</b>다. 다수결은 틀린 답이 2표 나올 수도 있다. 흔들리는 지점이 바로 사람이 확인해야 할 지점이다."},
{t:"chk",q:"AI로 영문 계약서를 번역했다. 가장 집중해서 대조해야 할 부분은?",
 c:["숫자·날짜·금액·당사자 이름 같은 고유값","문장의 어순","문단 길이","쉼표 위치"],a:0,
 e:"문장이 자연스러워도 <b>숫자 하나, 날짜 하나가 바뀌면 계약이 달라진다.</b> AI는 고유값을 조용히 바꿀 때가 있다. 고유값만 따로 뽑아 원문과 1:1로 대조한다."},

/* ────────────────────────────────────────────────────────── */
const KEY = "ai-drill-v1";
const $ = id => document.getElementById(id);
let state = { seen:{}, wrong:{}, star:{}, hist:[] };
try { state = Object.assign(state, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch(e){}
state.star = state.star || {}; state.hist = state.hist || [];
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }

const NUM = ["①","②","③","④"];
const SMOOTH = !(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
let topic = "all", mode = "rand", list = [], idx = 0, answered = false, curOrder = [];
let exam = null;

/* 실전 설정. 2교시 영역(P2)은 지문이 길어 1교시 풀에서 뺀다. */
/* 지문형 문항은 한 지문에 딸린 문항끼리 붙어 다녀야 한다 */
function groupUnits(ids){
  const out = [], byCase = {};
  ids.forEach(i => {
    const x = Q[i].x;
    if (!x){ out.push([i]); return; }
    if (byCase[x]){ byCase[x].push(i); return; }
    byCase[x] = [i]; out.push(byCase[x]);
  });
  return out;
}
const EXAMS = {
  1: { n: 20, sec: 30 * 60, pace: "문항당 90초",
       pick: () => {
         const pool = Q.map((q,i) => i).filter(i => !Q[i].x);
         return shuffled(pool.length).slice(0, 20).map(k => pool[k]);
       } },
  2: { n: 16, sec: 90 * 60, pace: "문항당 5분 40초 · 지문을 꼼꼼히",
       pick: () => {
         const units = groupUnits(Q.map((q,i) => i).filter(i => Q[i].x));
         const order = shuffled(units.length).map(k => units[k]);
         let out = [];
         order.forEach(u => { if (out.length + u.length <= 16) out = out.concat(u); });
         for (const u of order){                       // 16을 못 채우면 남은 지문 앞부분으로
           if (out.length >= 16) break;
           if (out.indexOf(u[0]) >= 0) continue;
           out = out.concat(u.slice(0, 16 - out.length));
         }
         return out;
       } }
};
function ctxHtml(q){
  if (!q.x) return "";
  const c = CASES[q.x];
  return '<div class="ctx"><div class="ctxh">지문 · ' + c.title + '</div>' + c.body + '</div>';
}

function shuffled(n){
  const o = [...Array(n).keys()];
  for (let j = n - 1; j > 0; j--){ const k = Math.floor(Math.random()*(j+1)); [o[j],o[k]] = [o[k],o[j]]; }
  return o;
}
const mmss = s => String(Math.floor(s/60)).padStart(2,"0") + ":" + String(s%60).padStart(2,"0");
function topicIds(){
  if (topic === "judge") return Q.map((q,i) => JUDGE_TOPICS.indexOf(q.t) >= 0 ? i : -1).filter(i => i >= 0);
  return topic === "all" ? Q.map((_,i) => i) : Q.map((q,i) => q.t === topic ? i : -1).filter(i => i >= 0);
}
function setDock(html){
  $("dockin").innerHTML = html;
  $("dock").hidden = !html;
}
function updateCounts(){
  const w = Object.keys(state.wrong).length, st = Object.keys(state.star).length;
  $("m-wrong").innerHTML = '틀린 것만<span class="cnt">' + w + '</span>';
  $("m-star").innerHTML = '★ 표시만<span class="cnt">' + st + '</span>';
}

/* ── 연습 ───────────────────────────────────────────────────── */
function build(){
  if (mode === "learn"){ renderLearn(); return; }
  let ids = topicIds();
  if (mode === "wrong") ids = ids.filter(i => state.wrong[i]);
  if (mode === "star")  ids = ids.filter(i => state.star[i]);
  if (mode !== "order"){                 // 기본은 매번 다른 순서. 지문 세트는 붙여서 섞는다
    const u = groupUnits(ids);
    ids = shuffled(u.length).map(k => u[k]).flat();
  }
  list = ids; idx = 0; render();
}

function stats(){
  if (exam) return;
  const ids = topicIds();
  const seen = ids.filter(i => state.seen[i]).length;
  const ok = ids.filter(i => state.seen[i] && !state.wrong[i]).length;
  $("stat").textContent = seen + " / " + ids.length + " · 정답률 "
    + (seen ? Math.round(ok/seen*100) + "%" : "—");
  $("stat").style.color = "";
  $("barfill").style.width = (ids.length ? seen/ids.length*100 : 0) + "%";
  updateCounts();
}

function render(){
  stats();
  const m = $("main");
  setDock("");
  if (!list.length){
    const msg = mode === "wrong" ? "틀린 문제가 없습니다."
              : mode === "star"  ? "☆ 를 눌러 헷갈리는 문제를 표시해 두면 여기서 다시 풀 수 있습니다."
              : "해당 영역에 문제가 없습니다.";
    m.innerHTML = '<div class="card done"><div class="big">0</div><p>' + msg + '</p></div>';
    return;
  }
  if (idx >= list.length){
    let ok = 0; const byT = {};
    list.forEach(i => { const t = Q[i].t; byT[t] = byT[t] || {n:0, ok:0}; byT[t].n++;
                        if (!state.wrong[i]){ ok++; byT[t].ok++; } });
    let rows = "";
    Object.keys(byT).sort((a,b) => byT[a].ok/byT[a].n - byT[b].ok/byT[b].n).forEach(t => {
      rows += '<tr><td>' + TOPICS[t] + '</td><td class="n">' + byT[t].ok + " / " + byT[t].n + '</td></tr>';
    });
    m.innerHTML = '<div class="card done"><div class="big">' + ok + " / " + list.length + '</div>'
      + '<p>이번 묶음 결과 · 약한 영역이 위에 옵니다</p>'
      + '<table class="sum"><tr><th>영역</th><th class="n">맞힘</th></tr>' + rows + '</table>'
      + '<div class="nav" style="justify-content:center">'
      + '<button class="go" id="again">새 순서로 다시</button>'
      + '<button class="go ghost" id="onlywrong">틀린 것만</button></div></div>';
    $("again").onclick = build;
    $("onlywrong").onclick = () => setMode("wrong");
    return;
  }

  const i = list[idx], q = Q[i];
  answered = false;
  curOrder = shuffled(q.c.length);           // 보기 순서도 매번 섞는다
  m.innerHTML = '<div class="card"><div class="cardtop">'
    + '<span class="tag">' + TOPICS[q.t] + ' · ' + (idx+1) + "/" + list.length + '</span>'
    + '<button class="star' + (state.star[i] ? " on" : "") + '" id="star" type="button" '
    + 'aria-label="헷갈림 표시">' + (state.star[i] ? "★" : "☆") + '</button></div>'
    + ctxHtml(q) + '<p class="q">' + q.q + '</p><div class="opts" id="opts"></div><div id="exp"></div></div>';
  curOrder.forEach((orig, j) => {
    const b = document.createElement("button");
    b.className = "opt"; b.type = "button";
    b.innerHTML = '<span class="k">' + NUM[j] + '</span><span>' + q.c[orig] + '</span>';
    b.onclick = () => pick(j);
    $("opts").appendChild(b);
  });
  $("star").onclick = toggleStar;
  setDock('<button class="go ghost" id="skip">모르겠음</button><span class="spacer"></span>'
        + '<button class="go" id="next" disabled>다음 →</button>');
  $("skip").onclick = () => pick(-1);
  $("next").onclick = nextQ;
}

function nextQ(){
  if (!answered) return;
  idx++; render();
  window.scrollTo(0, 0);
}

function pick(j){
  if (answered) return;
  answered = true;
  const i = list[idx], q = Q[i];
  const ansPos = curOrder.indexOf(q.a);
  const correct = j === ansPos;
  state.seen[i] = 1;
  if (correct) delete state.wrong[i]; else state.wrong[i] = 1;
  save();
  const bs = $("opts").children;
  for (let k = 0; k < bs.length; k++){
    bs[k].disabled = true;
    if (k === ansPos) bs[k].className = "opt " + (correct ? "pick-ok" : "reveal");
    if (k === j && !correct) bs[k].className = "opt pick-bad";
  }
  const head = correct ? "맞았습니다 · 정답 " + NUM[ansPos]
             : j < 0  ? "정답은 " + NUM[ansPos]
             : "틀렸습니다 · 내 답 " + NUM[j] + " → 정답 " + NUM[ansPos];
  $("exp").innerHTML = '<div class="exp"><div class="verdict ' + (correct ? "ok" : "bad") + '">' + head + '</div>'
    + (correct ? "" : '<div class="rvline ok">' + NUM[ansPos] + " " + q.c[q.a] + '</div>')
    + q.e + '</div>';
  $("next").disabled = false;
  stats();
  // 폰에서는 해설이 화면 아래로 밀려 안 보인다. 해설 위치로 내려 준다.
  setTimeout(() => { const ex = $("exp"); if (ex) ex.scrollIntoView({ behavior: SMOOTH ? "smooth" : "auto", block: "nearest" }); }, 40);
}

function toggleStar(){
  const i = exam ? exam.items[exam.idx].i : list[idx];
  if (i === undefined) return;
  if (state.star[i]) delete state.star[i]; else state.star[i] = 1;
  save();
  if (exam){ renderExam(); return; }
  const b = $("star");
  if (b){ b.classList.toggle("on", !!state.star[i]); b.textContent = state.star[i] ? "★" : "☆"; }
  updateCounts();
}

/* ── 약점 분석 ─────────────────────────────────────────────── */
function renderStats(){
  setDock("");
  const all = Q.map((_,i) => i);
  const seenAll = all.filter(i => state.seen[i]).length;
  const okAll = all.filter(i => state.seen[i] && !state.wrong[i]).length;
  $("stat").textContent = seenAll + " / " + Q.length + " · 정답률 " + (seenAll ? Math.round(okAll/seenAll*100) + "%" : "—");
  $("barfill").style.width = (seenAll / Q.length * 100) + "%";

  const rows = Object.keys(TOPICS).map(t => {
    const ids = all.filter(i => Q[i].t === t);
    const seen = ids.filter(i => state.seen[i]).length;
    const ok = ids.filter(i => state.seen[i] && !state.wrong[i]).length;
    return { t, n: ids.length, seen, ok, wrong: seen - ok, rate: seen ? ok / seen : null };
  });
  // 정답률 낮은 순. 안 푼 영역은 맨 아래
  rows.sort((a,b) => (a.rate === null ? 2 : a.rate) - (b.rate === null ? 2 : b.rate));

  let h = '<div class="card"><span class="tag">약점 분석</span>'
    + '<p class="q" style="margin-bottom:6px">정답률이 낮은 영역부터 보여줍니다</p>'
    + '<table class="wk"><tr><th>영역</th><th class="n">푼 문항</th><th class="barw">정답률</th><th></th></tr>';
  rows.forEach(r => {
    const pct = r.rate === null ? null : Math.round(r.rate * 100);
    const col = pct === null ? "var(--line)" : pct >= 80 ? "var(--ok)" : pct >= 60 ? "var(--accent)" : "var(--bad)";
    h += '<tr><td>' + TOPICS[r.t] + (P2.indexOf(r.t) >= 0 ? ' <span style="color:var(--muted);font-size:11px">2교시형</span>' : '')
      + '</td><td class="n">' + r.seen + " / " + r.n + '</td>'
      + '<td><div class="n" style="text-align:left;margin-bottom:3px">' + (pct === null ? "—" : pct + "%") + '</div>'
      + '<div class="bar2"><i style="width:' + (pct || 0) + '%;background:' + col + '"></i></div></td>'
      + '<td><button class="mini" data-t="' + r.t + '" data-w="' + r.wrong + '">'
      + (r.wrong ? "틀린 " + r.wrong + "개" : (r.seen < r.n ? "풀기" : "다시")) + '</button></td></tr>';
  });
  h += '</table></div>';

  h += '<div class="sec2">실전 기록</div>';
  if (!state.hist.length){
    h += '<p class="hint">아직 실전 기록이 없습니다. 실전 1교시·2교시를 보면 여기에 쌓입니다.</p>';
  } else {
    h += '<table class="hist">';
    state.hist.slice().reverse().forEach(x => {
      h += '<tr><td>' + x.d + '</td><td>' + x.k + '교시</td><td class="n">' + x.s + " / " + x.n
        + '</td><td class="n">' + mmss(x.u) + '</td></tr>';
    });
    h += '</table>';
  }
  $("main").innerHTML = h;
  document.querySelectorAll(".wk .mini").forEach(b => b.onclick = () => {
    topic = b.dataset.t;
    [...chips.children].forEach(c => c.setAttribute("aria-pressed", c.dataset.k === topic ? "true" : "false"));
    setMode(+b.dataset.w > 0 ? "wrong" : "rand");
  });
}

/* ── 실전 (1교시·2교시 공용) ─────────────────────────────────
   제출하기 전에는 정답을 보여주지 않는다. 실제 시험이 그렇다. */
function startExam(kind){
  const cfg = EXAMS[kind], picked = cfg.pick();
  exam = { kind, cfg, items: picked.map(i => ({ i, order: shuffled(Q[i].c.length) })),
           picks: {}, idx: 0, start: Date.now(), end: Date.now() + cfg.sec*1000, timer: null };
  exam.timer = setInterval(tickExam, 1000);
  renderExam();
}
function leftSec(){ return Math.max(0, Math.round((exam.end - Date.now())/1000)); }
function tickExam(){
  if (!exam) return;
  const l = leftSec();
  $("stat").textContent = "실전 " + exam.kind + "교시 · 남은 " + mmss(l);
  $("stat").style.color = l <= 300 ? "var(--bad)" : "";
  $("barfill").style.width = ((exam.cfg.sec - l) / exam.cfg.sec * 100) + "%";
  if (l <= 0) finishExam(true);
}
function goExam(k){
  if (!exam || k < 0 || k >= exam.items.length) return;
  exam.idx = k; renderExam(); window.scrollTo(0, 0);
}
function renderExam(){
  tickExam();
  if (!exam) return;
  const it = exam.items[exam.idx], q = Q[it.i];
  const answeredN = Object.keys(exam.picks).length;
  let nav = '<div class="qnav">';
  exam.items.forEach((x, k) => {
    nav += '<button type="button" data-k="' + k + '" class="' + (k === exam.idx ? "on " : "")
         + (exam.picks[k] !== undefined ? "done " : "") + (state.star[x.i] ? "flag" : "") + '">' + (k+1) + '</button>';
  });
  nav += '</div>';
  $("main").innerHTML = nav
    + '<div class="card"><div class="cardtop"><span class="tag">실전 ' + exam.kind + '교시 · '
    + (exam.idx+1) + "/" + exam.items.length + '</span>'
    + '<button class="star' + (state.star[it.i] ? " on" : "") + '" id="star" type="button" aria-label="다시 볼 문항 표시">'
    + (state.star[it.i] ? "★" : "☆") + '</button></div>'
    + ctxHtml(q) + '<p class="q">' + q.q + '</p><div class="opts" id="opts"></div></div>'
    + '<p class="hint">정답은 제출해야 나옵니다 · 남은 문항 ' + (exam.items.length - answeredN)
    + '개 · ' + exam.cfg.pace + ' 페이스 · ☆ 로 다시 볼 문항 표시</p>';
  it.order.forEach((orig, j) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "opt" + (exam.picks[exam.idx] === j ? " sel" : "");
    b.innerHTML = '<span class="k">' + NUM[j] + '</span><span>' + q.c[orig] + '</span>';
    b.onclick = () => { exam.picks[exam.idx] = j; renderExam(); };
    $("opts").appendChild(b);
  });
  $("star").onclick = toggleStar;
  document.querySelectorAll(".qnav button").forEach(b => b.onclick = () => goExam(+b.dataset.k));

  const last = exam.idx === exam.items.length - 1;
  setDock('<button class="go ghost" id="prev"' + (exam.idx === 0 ? " disabled" : "") + '>← 이전</button>'
        + '<span class="spacer"></span>'
        + (last ? '<button class="go" id="submit">제출</button>' : '<button class="go" id="nextq">다음 →</button>'));
  $("prev").onclick = () => goExam(exam.idx - 1);
  if ($("nextq")) $("nextq").onclick = () => goExam(exam.idx + 1);
  if ($("submit")) $("submit").onclick = function(){
    const blank = exam.items.length - Object.keys(exam.picks).length;
    if (blank > 0 && !this.dataset.confirm){        // confirm() 이 막혀 있어 두 번 누르게 한다
      this.dataset.confirm = "1";
      this.textContent = "빈 " + blank + "개 · 그래도 제출";
      return;
    }
    finishExam(false);
  };
}
function finishExam(auto){
  if (!exam) return;
  clearInterval(exam.timer);
  const ex = exam; exam = null;
  setDock("");
  const used = Math.min(ex.cfg.sec, Math.round((Date.now() - ex.start)/1000));
  let ok = 0; const wrong = []; const byT = {};
  ex.items.forEach((it, k) => {
    const ansPos = it.order.indexOf(Q[it.i].a);
    const good = ex.picks[k] === ansPos;
    const t = Q[it.i].t;
    byT[t] = byT[t] || {n:0, ok:0}; byT[t].n++;
    state.seen[it.i] = 1;
    if (good){ ok++; byT[t].ok++; delete state.wrong[it.i]; }
    else { state.wrong[it.i] = 1; wrong.push({k, it, pick: ex.picks[k], ansPos}); }
  });
  const now = new Date();
  state.hist.push({ k: ex.kind, s: ok, n: ex.items.length, u: used,
                    d: (now.getMonth()+1) + "/" + now.getDate() + " " + String(now.getHours()).padStart(2,"0")
                       + ":" + String(now.getMinutes()).padStart(2,"0") });
  state.hist = state.hist.slice(-20);
  save();
  $("stat").style.color = "";
  let rows = "";
  Object.keys(byT).sort((a,b) => byT[a].ok/byT[a].n - byT[b].ok/byT[b].n).forEach(t => {
    rows += '<tr><td>' + TOPICS[t] + '</td><td class="n">' + byT[t].ok + " / " + byT[t].n + '</td></tr>';
  });
  let h = '<div class="card done"><div class="big">' + ok + " / " + ex.items.length + '</div>'
    + '<p>실전 ' + ex.kind + '교시 · ' + (auto ? "시간 종료로 자동 제출 · " : "")
    + "소요 " + mmss(used) + " / " + mmss(ex.cfg.sec) + " · 문항당 평균 "
    + Math.round(used / ex.items.length) + "초</p>"
    + '<table class="sum"><tr><th>영역 (약한 순)</th><th class="n">맞힘</th></tr>' + rows + '</table>'
    + '<div class="nav" style="justify-content:center">'
    + '<button class="go" id="again">다시 실전</button>'
    + '<button class="go ghost" id="towrong">틀린 것만 연습</button></div></div>';
  if (wrong.length){
    h += '<h2 class="rv">틀린 문항 ' + wrong.length + '개</h2>';
    wrong.forEach(w => {
      const q = Q[w.it.i];
      const mine = w.pick === undefined ? "(빈칸)" : NUM[w.pick] + " " + q.c[w.it.order[w.pick]];
      h += '<div class="card"><span class="tag">' + TOPICS[q.t] + ' · ' + (w.k+1) + '번</span>'
        + (q.x ? '<div class="ctxh">지문 · ' + CASES[q.x].title + '</div>' : '')
        + '<p class="q">' + q.q + '</p>'
        + '<div class="rvline bad">내 답 · ' + mine + '</div>'
        + '<div class="rvline ok">정답 · ' + NUM[w.ansPos] + " " + q.c[q.a] + '</div>'
        + '<div class="exp">' + q.e + '</div></div>';
    });
  }
  $("main").innerHTML = h;
  $("barfill").style.width = "100%";
  window.scrollTo(0, 0);
  updateCounts();
  $("again").onclick = () => setMode("exam" + ex.kind);
  $("towrong").onclick = () => setMode("wrong");
}

const LESSON_ORDER = ["gen", "rag", "prm", "ml", "dl", "val", "eth", "mfg", "hw", "judge"];
const JUDGE_TOPICS = ["sce", "chk", "pcmp", "data", "case"];
function lessonKey(t){ return LESSONS[t] ? t : (t === "judge" || JUDGE_TOPICS.indexOf(t) >= 0 ? "judge" : null); }
function lessonQCount(k){
  return Q.filter(q => k === "judge" ? JUDGE_TOPICS.indexOf(q.t) >= 0 : q.t === k).length;
}
function setTopic(t){
  topic = t;
  [...chips.children].forEach(c => c.setAttribute("aria-pressed", c.dataset.k === t ? "true" : "false"));
}

function renderLearn(){
  setDock("");
  state.read = state.read || {};
  const nRead = LESSON_ORDER.filter(k => state.read[k]).length;
  $("stat").textContent = "개념 학습 · 읽음 " + nRead + " / " + LESSON_ORDER.length;
  $("stat").style.color = "";
  $("barfill").style.width = (nRead / LESSON_ORDER.length * 100) + "%";
  updateCounts();
  const k = topic === "all" ? null : lessonKey(topic);
  const m = $("main");

  if (!k){
    let h = '<div class="card"><span class="tag">개념 학습</span>'
      + '<p class="q" style="margin-bottom:4px">문제를 풀기 전에 영역별 학습지로 개념부터 잡으세요.</p>'
      + '<p class="hint" style="margin:0 0 14px">학습지 끝에서 그 영역 문제로 바로 넘어갈 수 있습니다. 위의 영역 버튼을 눌러도 학습지가 열립니다.</p>'
      + '<div class="lsnlist">';
    LESSON_ORDER.forEach((key, n) => {
      const L = LESSONS[key];
      h += '<button type="button" class="lsn" data-k="' + key + '">'
        + '<span class="lsn-n">' + String(n + 1).padStart(2, "0") + '</span>'
        + '<span class="lsn-b"><b>' + L.title + '</b>'
        + '<span class="lsn-m">개념 ' + L.terms.length + '개 · 문제 ' + lessonQCount(key) + '개</span></span>'
        + '<span class="lsn-r' + (state.read[key] ? ' on' : '') + '">' + (state.read[key] ? '읽음' : '') + '</span></button>';
    });
    m.innerHTML = h + '</div></div>';
    document.querySelectorAll(".lsn").forEach(b => b.onclick = () => {
      setTopic(b.dataset.k); renderLearn(); window.scrollTo(0, 0);
    });
    return;
  }

  const L = LESSONS[k], pos = LESSON_ORDER.indexOf(k);
  let h = '<article class="card lesson"><span class="tag">개념 학습 · ' + (pos + 1) + ' / ' + LESSON_ORDER.length + '</span>'
    + '<h2>' + L.title + '</h2><p class="lead">' + L.lead + '</p>';
  if (L.steps){
    h += '<h3 class="lsec">푸는 순서</h3><ol class="steps">';
    L.steps.forEach(s => { h += '<li><b>' + s[0] + '</b><span>' + s[1] + '</span><span class="tip">' + s[2] + '</span></li>'; });
    h += '</ol>';
  }
  h += '<h3 class="lsec">핵심 개념</h3><dl class="terms">';
  L.terms.forEach(t => {
    h += '<dt>' + t[0] + '</dt><dd>' + t[1] + (t[2] ? '<span class="tip">' + t[2] + '</span>' : '') + '</dd>';
  });
  h += '</dl>';
  if (L.compare){
    h += '<h3 class="lsec">한눈에 비교</h3><div class="tblw"><table class="cmp"><tr>';
    L.compare.head.forEach(x => { h += '<th>' + x + '</th>'; });
    h += '</tr>';
    L.compare.rows.forEach(r => { h += '<tr>' + r.map((x, i) => i === 0 ? '<th>' + x + '</th>' : '<td>' + x + '</td>').join("") + '</tr>'; });
    h += '</table></div>';
  }
  h += '<h3 class="lsec">시험에 이렇게 나온다</h3><ul class="pts">';
  L.points.forEach(p => { h += '<li>' + p + '</li>'; });
  h += '</ul></article>';
  const next = LESSON_ORDER[pos + 1];
  h += '<div class="nav lnav"><button class="go ghost" id="toidx" type="button">← 학습지 목록</button>'
    + (next ? '<button class="go ghost" id="tonext" type="button">다음: ' + LESSONS[next].title + ' →</button>' : '')
    + '</div>';
  m.innerHTML = h;
  setDock('<button class="go ghost" id="markread" type="button">' + (state.read[k] ? '읽음 ✓' : '다 읽음 표시') + '</button>'
    + '<span class="spacer"></span><button class="go" id="topractice" type="button">이 영역 문제 풀기 · ' + lessonQCount(k) + '</button>');
  $("toidx").onclick = () => { setTopic("all"); renderLearn(); window.scrollTo(0, 0); };
  if ($("tonext")) $("tonext").onclick = () => { setTopic(next); renderLearn(); window.scrollTo(0, 0); };
  $("markread").onclick = () => {
    if (state.read[k]) delete state.read[k]; else state.read[k] = 1;
    save(); renderLearn();
  };
  $("topractice").onclick = () => {
    state.read[k] = 1; save();
    setTopic(k);
    setMode("rand");
  };
}

const chips = $("chips");
function addChip(key, label){
  const b = document.createElement("button");
  b.className = "chip"; b.type = "button"; b.textContent = label; b.dataset.k = key;
  b.setAttribute("aria-pressed", key === topic ? "true" : "false");
  b.onclick = () => {
    topic = key;
    [...chips.children].forEach(c => c.setAttribute("aria-pressed", "false"));
    b.setAttribute("aria-pressed", "true");
    if (exam || mode === "stat") setMode("rand"); else build();
  };
  chips.appendChild(b);
}
addChip("all", "전체 " + Q.length);
Object.keys(TOPICS).forEach(k => addChip(k, TOPICS[k] + " " + Q.filter(q => q.t === k).length));

  MODE_IDS.forEach(x => $("m-" + x).setAttribute("aria-pressed", x === m ? "true" : "false"));
  const isExam = m === "exam1" || m === "exam2";
  chips.style.display = (isExam || m === "stat") ? "none" : "";
  if (isExam) startExam(m === "exam1" ? 1 : 2);
  else if (m === "stat") renderStats();
  else build();
  window.scrollTo(0, 0);
}
MODE_IDS.forEach(x => { $("m-" + x).onclick = () => setMode(x); });

/* 기록 지우기 — 되돌릴 수 없으니 두 번 누르게 한다 */
$("m-reset").onclick = function(){
  if (!this.dataset.confirm){
    this.dataset.confirm = "1"; this.textContent = "한 번 더 누르면 지워집니다";
    setTimeout(() => { delete this.dataset.confirm; this.textContent = "기록 지우기"; }, 3000);
    return;
  }
  delete this.dataset.confirm; this.textContent = "기록 지우기";
  state = { seen:{}, wrong:{}, star:{}, hist:[] }; save();
  setMode(mode.indexOf("exam") === 0 ? "rand" : mode);
};

/* PC 단축키 */
document.addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const n = "1234".indexOf(e.key);
  if (exam){
    if (n >= 0){ exam.picks[exam.idx] = n; renderExam(); }
    else if (e.key === "ArrowRight") goExam(exam.idx + 1);
    else if (e.key === "ArrowLeft")  goExam(exam.idx - 1);
    else if (e.key === "s" || e.key === "S") toggleStar();
    return;
  }
  if (mode === "stat" || !$("opts")) return;
  if (n >= 0 && !answered) pick(n);
  else if ((e.key === "Enter" || e.key === "ArrowRight") && answered){ e.preventDefault(); nextQ(); }
  else if (e.key === "s" || e.key === "S") toggleStar();
});

build();
</script>
</body>
